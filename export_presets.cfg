[preset.0]
name="Android Debug"
platform="Android"
runnable=true
advanced_options=true
export_filter="all_resources"
include_filter="content/*.json,content/locales/*.json,games/*/*.json"
exclude_filter="tests/*,scripts/*,docs/*,addons/*,android/*,build/*,qa-results/*,*.yaml,*.keystore,*.jks,*.p12,*.pem"
export_path="build/android/kinderwelt-debug.apk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]
gradle_build/use_gradle_build=true
gradle_build/export_format=0
gradle_build/min_sdk="24"
gradle_build/target_sdk="36"
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=true
version/code=2
version/name="0.2.0"
package/unique_name="org.example.kinderwelt"
package/name="Kinderwelt"
package/signed=true
package/app_category=2
package/retain_data_on_uninstall=false
launcher_icons/main_192x192="res://assets/icons/kinderwelt.svg"
launcher_icons/adaptive_foreground_432x432="res://assets/icons/kinderwelt.svg"
launcher_icons/adaptive_monochrome_432x432="res://assets/icons/kinderwelt.svg"
permissions/internet=false
permissions/access_network_state=false
permissions/vibrate=false
permissions/custom_permissions=PackedStringArray()
user_data_backup/allow=false
splash_screen/background_color=Color(0.984, 0.973, 0.941, 1)
splash_screen/icon="res://assets/icons/kinderwelt.svg"
screen/background_color=Color(0.984, 0.973, 0.941, 1)
command_line/extra_args=""

