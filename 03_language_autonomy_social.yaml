id: 03_language_autonomy_social
title: "Three learning modules: language, autonomy and social cooperation"
priority: 3
depends_on: [01_foundation]
estimated_effort_hours: 5-7
objective: >
  Add three compact, replayable modules. All activities must be fully playable
  solo; a parent can optionally join on the same device.
modules:
  language:
    name: "Die Bildergeschichte"
    mechanics:
      - "Listen to a short narrated or sound-supported story and arrange 3-5 picture cards."
      - "Provide replayable audio and expressive visual clues."
      - "At least six stories with editable data definitions."
    learning_hypotheses: ["listening comprehension", "sequencing", "storytelling"]
  autonomy:
    name: "Die Entdeckerwerkstatt"
    mechanics:
      - "Open-ended experiment puzzles with reversible actions and no time pressure."
      - "Allow multiple attempts, optional staged hints and self-chosen order."
      - "At least six tasks with clearly communicated outcomes."
    learning_hypotheses: ["persistence", "self-regulation", "independent exploration"]
  social:
    name: "Das gemeinsame Dorf"
    mechanics:
      - "Help two characters with differing needs reach a fair solution."
      - "Choices are shown as pictograms with optional narration."
      - "At least six scenarios; avoid simplistic moral scoring or shaming."
      - "Optional parent discussion prompts live behind an adult-accessible control."
    learning_hypotheses: ["perspective-taking", "cooperation", "communication"]
accessibility:
  - "German language defaults; centralized localization keys for later translations."
  - "If natural narration cannot be produced lawfully and reliably, use concise sound cues and documented narration slots; do not claim speech is implemented."
  - "Color is never the sole carrier of meaning."
  - "Avoid stereotypes, distressing imagery and coercive reward loops."
tests:
  - "Scenario data validity and reachable completion checks."
  - "Solo-mode completion of every scenario."
  - "Parent prompts never block child progress."
acceptance_criteria:
  - "Three integrated modules with at least six playable scenarios each."
  - "All five learning areas available from the hub."
  - "Documented content authoring instructions."
