id: 02_logic_math
title: "Two learning modules: logic and mathematics"
priority: 2
depends_on: [01_foundation]
estimated_effort_hours: 4-6
objective: >
  Build two replayable, visually guided minigames for ages 6-8 using the
  platform's reusable minigame and level-data interfaces.
modules:
  logic:
    name: "Die Brueckenwerkstatt"
    goal: "Guide a friendly character across obstacles by arranging safe bridge pieces."
    mechanics:
      - "Drag or tap pieces into obvious sockets; no fine motor precision required."
      - "Multiple valid solutions where feasible."
      - "Three increasing difficulty tiers with at least three levels each."
      - "Immediate explanatory visual feedback and unlimited retries."
    learning_hypotheses: ["cause and effect", "planning", "flexible problem solving"]
  mathematics:
    name: "Der Marktstand"
    goal: "Help characters share and compare small collections of objects."
    mechanics:
      - "Count, match, sort and distribute quantities primarily in the 1-10 range."
      - "Use visible manipulatives; numbers may appear but are not required to play."
      - "Three difficulty tiers with at least three levels each."
      - "Adaptive difficulty based on recent successes; no hidden punishment."
    learning_hypotheses: ["number sense", "quantity comparison", "simple patterns"]
shared_requirements:
  - "All instructions understandable from animation, iconography and replayable audio cues."
  - "No timers, failure penalties or compulsory reading."
  - "A hint ladder offers gesture, partial hint, then worked example."
  - "Each module works alone; adult can discuss or assist without exclusive controls."
  - "Levels defined in editable data files, not hard-coded scenes."
tests:
  - "Automated checks for valid level schemas and solvability."
  - "Tests for completion, retry, hint and difficulty progression."
  - "Touch interaction smoke tests where supported; document manual device checks."
acceptance_criteria:
  - "At least nine playable levels in each of two modules."
  - "All levels completable without text input."
  - "No blocking soft-locks on retry or return-to-hub."
