# INACTIVE TEMPLATE: not in .github/workflows/. Operator approval required.
# Replace/approve privacy placeholders and configure Pages first, then copy this
# file into .github/workflows/. No automatic push trigger or family assets.
name: Publish approved privacy pages (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pages:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 scripts/store/privacy.py --final --output build/privacy
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: build/privacy
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        id: deployment
