name: Kinderwelt quality gates
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      retain_evidence:
        description: Retain technical reports and rendered screenshots
        type: boolean
        default: false
      listening_review:
        description: Prepare and retain complete offline listening pack (about 180 MB)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  quality:
    env:
      KINDERWELT_VARIANT: public
    runs-on: ubuntu-24.04
    # 400 stations, all localized bonuses and larger real-frame coverage.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Godot
        run: GODOT_INSTALL_DIR="$RUNNER_TEMP/godot" bash scripts/install-godot.sh
      - name: Install audio decoder
        run: bash scripts/ci/install-audio-decoder.sh
      - name: Complete current test suite
        run: GODOT="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" bash tests/run.sh
      - name: Original tasks, science samples, languages and animations at four display profiles
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" LIBGL_ALWAYS_SOFTWARE=1 \
            xvfb-run -a bash tests/qa/quest-render.sh qa-results/visual
      - name: Retain technical evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.retain_evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: child-experience-verification
          path: qa-results/
          if-no-files-found: error
          retention-days: 3
      - name: Prepare complete offline adult listening review without family images
        if: github.event_name == 'workflow_dispatch' && inputs.listening_review
        run: python3 scripts/qa/review_pack.py prepare --output build/listening-acceptance
      - name: Retain complete offline adult listening review
        if: github.event_name == 'workflow_dispatch' && inputs.listening_review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kinderwelt-full-listening-review
          path: build/listening-acceptance/
          if-no-files-found: error
          retention-days: 3
