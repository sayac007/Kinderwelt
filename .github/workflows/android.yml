name: Development female multilingual speech dependency
on: workflow_dispatch
permissions:
  contents: write
jobs:
  download:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Mirror pinned Apache-2.0 multilingual development model
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import hashlib,json,subprocess
          from pathlib import Path
          source=json.loads(Path('scripts/ci/qwen-source.json').read_text())
          root=Path('qwen-female');root.mkdir()
          for row in source['files']:
              p=root/row['path'];p.parent.mkdir(parents=True,exist_ok=True)
              url='https://huggingface.co/'+source['repo']+'/resolve/'+source['revision']+'/'+row['path']+'?download=true'
              subprocess.run(['curl','--fail','--location','--retry','3','--max-time','600',url,'-o',str(p)],check=True)
              assert p.stat().st_size==row['size'],row['path']
              if row['sha256']:assert hashlib.sha256(p.read_bytes()).hexdigest()==row['sha256'],row['path']
          PYTHON
          curl --fail --location https://raw.githubusercontent.com/QwenLM/Qwen3-TTS/022e286b98fbec7e1e916cb940cdf532cd9f488e/LICENSE -o qwen-female/LICENSE.txt
          echo 'a44a6081c73ad75f0255bb2bb5cab74ef1829565a895a24e53a4f11290ab7655  qwen-female/LICENSE.txt' | sha256sum -c -
          mv qwen-female/model.safetensors qwen-model.safetensors
          mv qwen-female/speech_tokenizer/model.safetensors qwen-speech-tokenizer.safetensors
          cp scripts/ci/qwen-source.json qwen-female/source.json
          tar -czf qwen-config.tar.gz qwen-female
          if ! gh release view voice-tools-qwen3-female >/dev/null 2>&1; then
            gh release create voice-tools-qwen3-female --target "$GITHUB_SHA" --prerelease --title 'Development tooling: Apache-2.0 multilingual female speech' --notes 'Pinned official Qwen3-TTS-12Hz-0.6B-CustomVoice dependency for offline generation. No actor, family recordings, app release, keys or credentials. https://huggingface.co/Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice (Apache-2.0).'
          fi
          gh release upload voice-tools-qwen3-female qwen-model.safetensors qwen-speech-tokenizer.safetensors qwen-config.tar.gz --clobber
