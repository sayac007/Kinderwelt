name: Android verification builds
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Godot
        run: GODOT_INSTALL_DIR="$RUNNER_TEMP/tools/godot-4.7.2" bash scripts/install-godot.sh
      - name: Install checksum-pinned Android toolchain
        # Repository maintainers must accept the Android SDK licence before enabling this workflow.
        run: python3 scripts/android/install.py --root "$RUNNER_TEMP/tools" --accept-android-sdk-license
      - name: Install decoder for real offline audio checks
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Android subprocess and artifact checker regressions
        run: python3 -m unittest discover -s tests/android -v
      - name: Build and verify development APK and unsigned AAB
        run: |
          GODOT="$RUNNER_TEMP/tools/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64" \
            python3 scripts/android/build.py --tools "$RUNNER_TEMP/tools"
      - name: Retain artifacts and technical evidence (no signing material)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-development-artifacts
          path: build/android/
          if-no-files-found: error
          retention-days: 7
