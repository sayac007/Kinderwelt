name: Android verification builds
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      variant:
        description: Variant to build for this manual test run
        type: choice
        default: neutral
        options:
          - both
          - family
          - neutral
      include_unsigned_bundles:
        description: Also retain unsigned AABs (not uploadable to Play; about 300 MB each)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # Only an explicitly requested manual family/both build receives private assets.
      - name: Read pinned private asset source for trusted builds
        id: family_assets
        if: github.event_name == 'workflow_dispatch' && inputs.variant != 'neutral'
        env:
          FAMILY_ASSETS_TOKEN: ${{ secrets.KINDERWELT_FAMILY_ASSETS_TOKEN }}
        run: |
          if [ -z "$FAMILY_ASSETS_TOKEN" ]; then
            echo '::error::KINDERWELT_FAMILY_ASSETS_TOKEN is missing. Configure read-only Contents access to the separate private family-assets repository.'
            exit 1
          fi
          python3 scripts/ci/family_assets.py plan
          family_repo=$(python3 -c 'import json; print(json.load(open("scripts/ci/family-assets.json"))["repository"])')
          private_flag=$(GH_TOKEN="$FAMILY_ASSETS_TOKEN" gh api "repos/$family_repo" --jq '.private')
          if [ "$private_flag" != true ]; then
            echo '::error::The family illustration repository must be private.'
            exit 1
          fi
      - name: Check out only the pinned revision of the private family illustration repository
        if: github.event_name == 'workflow_dispatch' && inputs.variant != 'neutral'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ steps.family_assets.outputs.repository }}
          ref: ${{ steps.family_assets.outputs.revision }}
          token: ${{ secrets.KINDERWELT_FAMILY_ASSETS_TOKEN }}
          path: .private/family-assets
          persist-credentials: false
      - name: Verify and import generated family illustrations; no source photos
        if: github.event_name == 'workflow_dispatch' && inputs.variant != 'neutral'
        run: python3 scripts/ci/family_assets.py restore
      - name: Install pinned Godot
        run: GODOT_INSTALL_DIR="$RUNNER_TEMP/tools/godot-4.7.2" bash scripts/install-godot.sh
      - name: Install checksum-pinned Android toolchain
        # Repository maintainers must accept the Android SDK licence before enabling this workflow.
        run: python3 scripts/android/install.py --root "$RUNNER_TEMP/tools" --accept-android-sdk-license
      - name: Reuse development signing identity for updates that preserve local points
        if: github.event_name != 'pull_request'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/tools/preview-signing
          key: kinderwelt-development-certificate-v090
      - name: Install decoder for real offline audio checks
        run: bash scripts/ci/install-audio-decoder.sh
      - name: Android subprocess and artifact checker regressions
        run: |
          python3 scripts/variants.py prepare --variant public --output .
          python3 -m unittest discover -s tests/android -v
      - name: Build selected separately installable APKs and unsigned bundles
        if: github.event_name != 'pull_request'
        env:
          BUILD_VARIANT: ${{ github.event_name == 'workflow_dispatch' && inputs.variant || 'neutral' }}
        run: |
          case "$BUILD_VARIANT" in
            both) set -- ;;
            family|neutral) set -- --variants "$BUILD_VARIANT" ;;
            *) echo '::error::Unsupported build variant'; exit 1 ;;
          esac
          GODOT="$RUNNER_TEMP/tools/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64" \
            python3 scripts/android/build_variants.py --tools "$RUNNER_TEMP/tools" "$@"
      - name: Verify neutral Android export for pull requests without private secrets
        if: github.event_name == 'pull_request'
        run: |
          GODOT="$RUNNER_TEMP/tools/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64" \
            python3 scripts/android/build_variants.py --variants neutral --tools "$RUNNER_TEMP/tools"
      - name: Measure neutral download with pinned bundletool (arm64, de)
        # Family-only runs contain no neutral bundle to measure.
        # The size budget only warns; an actual measurement error still fails.
        if: success() && !(github.event_name == 'workflow_dispatch' && inputs.variant == 'family')
        run: |
          python3 scripts/android/size_report.py \
            --bundle build/android-delivery/kinderwelt-unsigned-neutral.aab \
            --tools "$RUNNER_TEMP/tools" --output build/android-delivery/size-neutral
      # Automatic push/PR runs still export, verify and measure, without artifact storage.
      - name: Retain only manually requested APKs and technical evidence
        if: success() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.variant == 'family' && 'kinderwelt-family-test' || 'android-development-artifacts' }}
          path: |
            build/android-delivery/kinderwelt-debug-*.apk
            build/android-delivery/delivery.json
            build/android-delivery/*/*.json
            build/android-delivery/*/*.txt
            build/android-delivery/*/*.log
            build/android-delivery/size-neutral/*.csv
            build/android-delivery/size-neutral/*.md
          if-no-files-found: error
          retention-days: 3
      - name: Retain unsigned bundles only when explicitly requested
        if: success() && github.event_name == 'workflow_dispatch' && inputs.include_unsigned_bundles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kinderwelt-unsigned-bundles
          path: build/android-delivery/kinderwelt-unsigned-*.aab
          if-no-files-found: error
          retention-days: 3
      - name: Retain small export diagnostics for failed manual builds
        if: failure() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-build-diagnostics
          path: |
            build/android-delivery/*/*.json
            build/android-delivery/*/*.txt
            build/android-delivery/*/*.log
          if-no-files-found: warn
          retention-days: 3
