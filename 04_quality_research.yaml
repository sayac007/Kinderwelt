id: 04_quality_research
title: "Quality, accessibility and educational evaluation"
priority: 4
depends_on: [01_foundation, 02_logic_math, 03_language_autonomy_social]
estimated_effort_hours: 3-5
objective: >
  Make the game testable, reproducible and suitable for supervised child
  usability trials without pretending educational efficacy has been proven.
quality_gates:
  - "Godot headless import and project startup must succeed."
  - "Use existing Godot testing frameworks (e.g. GUT or GdUnit4) if compatible; pin versions."
  - "Run framework's existing automated tests; record actual commands, versions and results."
  - "Validate every authored level and scenario for schema and completion path."
  - "Check save/load, fresh install, repeated retry, audio mute, screen rotation and back navigation."
  - "Perform static checks for network calls, tracking SDKs, unnecessary permissions and secrets."
  - "Check UI at representative small-phone and tablet viewports."
  - "Provide manual accessibility and device-testing checklists where automation is impossible."
benchmark_policy:
  - "Reuse established tool benchmarks and tests where applicable; do not invent a child-development benchmark."
  - "Measure cold launch time, frame-rate stability and memory on specified real devices only if available."
  - "If no device exists, mark performance metrics NOT MEASURED rather than fabricating values."
  - "Distinguish within-game task mastery from transfer to real-world skills."
research_protocol:
  - "Optional anonymous, local-only observation sheet for parent/guardian."
  - "Track task completion, hint requests, frustration, voluntary return and accessibility issues."
  - "No child data collection or cloud export by default."
  - "Do not claim cognitive, social or educational improvement without appropriate controlled evidence."
outputs:
  - "tests/ automated suite and CI configuration"
  - "docs/test-report.md with pass/fail/not-run status"
  - "docs/child-usability-checklist.md"
  - "docs/learning-hypotheses.md with limitations"
acceptance_criteria:
  - "No known critical crashes or soft-locks."
  - "CI runs reproducibly; failures explicitly documented."
  - "No fabricated benchmark results or educational claims."
